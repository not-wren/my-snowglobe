<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <title>My Snowglobe</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body> 
        <header class="hero">
            <h1> Shake the Snowglobe </h1>
            <p class="tagline">a little kindness for the holiday season</p>
        </header>
        <main>
            <section class="globe-card">
                <div class="globe" id="globe ">
                    <img class="scene" src="https://i.imgur.com/eDKTsdk.png" alt="snowglobe">
                </div>
                <button id="shake">Shake the globe!!!</button>
                <p class="message" id="message">see which snowflake you get</p>
            </section>
        </main>
        <footer>
            <p>made my me while making a snow angel</p>
        </footer>
    </body>
</html>
