<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>my pumpkin</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="hero">
      <h1>my pumpkin</h1>
      <p class="tagline">a little kindness for the spooky season</p>
    </header>
    <main>
      <section class="globe-card">
        <div class="globe" id="globe">
          <img class="scene" src="https://i.imgur.com/eDKTsdk.png" alt="a snowglobe" />
        </div>
        <button id="shake">shake the squash</button>
        <p class="message" id="message">press the button and see what seeds of wisdom come out</p>
      </section>
    </main>
    <footer>
      <p>made by me, a ghost</p>
        <script src="script.js"></script>
    </footer>
  </body>
</html>
